<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Ad Creative 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .ad-container {
            width: 390px;
            background: #000;
            overflow: hidden;
        }
        
        .search-bar {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
        }
        
        .back-arrow {
            color: #fff;
            font-size: 20px;
        }
        
        .search-input {
            flex: 1;
            background: #222;
            border-radius: 4px;
            padding: 10px 14px;
            color: #999;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .search-input::before {
            content: "🔍";
            font-size: 12px;
        }
        
        .search-btn {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }
        
        .image-section {
            width: 100%;
            height: 280px;
            background: linear-gradient(180deg, #1e3a5f 0%, #0f1f33 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .ceo-visual {
            text-align: center;
        }
        
        .calendar-strike {
            font-size: 80px;
            position: relative;
        }
        
        .calendar-strike::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -10%;
            width: 120%;
            height: 6px;
            background: #ef4444;
            transform: rotate(-15deg);
        }
        
        .happy-face {
            font-size: 60px;
            margin-top: 15px;
        }
        
        .chart-up {
            font-size: 40px;
            color: #22c55e;
        }
        
        .logo-bar {
            background: #fff;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-text {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 18px;
            color: #000;
            letter-spacing: -0.5px;
        }
        
        .logo-accent {
            color: #c44536;
        }
        
        .headline-section {
            background: #000;
            padding: 24px 20px;
            text-align: center;
        }
        
        .headline {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 26px;
            line-height: 1.2;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }
        
        .highlight-yellow {
            background: #fbbf24;
            color: #000;
            padding: 2px 6px;
        }
        
        .highlight-red {
            background: #ef4444;
            color: #fff;
            padding: 2px 6px;
        }
        
        .swipe-indicator {
            display: flex;
            justify-content: center;
            padding: 16px;
            gap: 6px;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #666;
        }
        
        .dot.active {
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="ad-container">
        <!-- Search bar -->
        <div class="search-bar">
            <span class="back-arrow">←</span>
            <div class="search-input">ceo content burnout</div>
            <span class="search-btn">Search</span>
        </div>
        
        <!-- Image -->
        <div class="image-section">
            <div class="ceo-visual">
                <div class="calendar-strike">📅</div>
                <div class="happy-face">😌 <span class="chart-up">📈</span></div>
            </div>
        </div>
        
        <!-- Logo -->
        <div class="logo-bar">
            <span class="logo-text">FTS <span class="logo-accent">MEDIA</span></span>
        </div>
        
        <!-- Headline -->
        <div class="headline-section">
            <h1 class="headline">
                CEO <span class="highlight-red">QUITS POSTING DAILY</span> — SOMEHOW GETS <span class="highlight-yellow">MORE LEADS</span>
            </h1>
        </div>
        
        <!-- Dots -->
        <div class="swipe-indicator">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</body>
</html>
